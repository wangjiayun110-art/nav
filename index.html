<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的导航 - 上网从这里开始</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* 搜索框 */
        .search-box {
            text-align: center;
            margin: 60px 0 40px;
        }
        .search-box h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        .search-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }
        .search-form input {
            flex: 1;
            padding: 15px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.95);
            color: #333;
            outline: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .search-form button {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            background: #ff6b6b;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .search-form button:hover { transform: scale(1.05); }
        
        .engines {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .engines span {
            padding: 8px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .engines span:hover, .engines span.active {
            background: rgba(255,255,255,0.4);
        }
        
        /* 时间显示 */
        .time {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        /* 分类 */
        .section {
            margin: 40px 0;
        }
        .section-title {
            font-size: 1.3em;
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 4px solid #ffd700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .card {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .card:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .card .icon {
            font-size: 2em;
            margin-bottom: 10px;
            display: block;
        }
        .card .name {
            font-size: 0.95em;
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 时间 -->
        <div class="time" id="time"></div>
        
        <!-- 搜索 -->
        <div class="search-box">
            <h1>🔍 我的导航</h1>
            <form class="search-form" onsubmit="return search()">
                <input type="text" id="q" placeholder="搜索网页、视频、图片...">
                <button type="submit">搜索</button>
            </form>
            <div class="engines">
                <span class="active" onclick="setEngine('baidu')">百度</span>
                <span onclick="setEngine('google')">Google</span>
                <span onclick="setEngine('bing')">Bing</span>
                <span onclick="setEngine('zhihu')">知乎</span>
                <span onclick="setEngine('bilibili')">B站</span>
            </div>
        </div>
        
        <!-- 常用网站 -->
        <div class="section">
            <h2 class="section-title">⭐ 常用网站</h2>
            <div class="grid" id="common"></div>
        </div>
        
        <!-- 视频 -->
        <div class="section">
            <h2 class="section-title">🎬 视频娱乐</h2>
            <div class="grid" id="video"></div>
        </div>
        
        <!-- 社交 -->
        <div class="section">
            <h2 class="section-title">💬 社交媒体</h2>
            <div class="grid" id="social"></div>
        </div>
        
        <!-- 工具 -->
        <div class="section">
            <h2 class="section-title">🛠️ 常用工具</h2>
            <div class="grid" id="tools"></div>
        </div>
        
        <!-- AI -->
        <div class="section">
            <h2 class="section-title">🤖 AI 助手</h2>
            <div class="grid" id="ai"></div>
        </div>
        
        <div class="footer">
            <p>📚 收藏本页，上网更方便</p>
        </div>
    </div>
    
    <script>
        let engine = 'baidu';
        const engines = {
            baidu: 'https://www.baidu.com/s?wd=',
            google: 'https://www.google.com/search?q=',
            bing: 'https://www.bing.com/search?q=',
            zhihu: 'https://www.zhihu.com/search?q=',
            bilibili: 'https://search.bilibili.com/all?keyword='
        };
        
        const sites = {
            common: [
                { name: '百度', icon: '🔍', url: 'https://www.baidu.com' },
                { name: '淘宝', icon: '🛒', url: 'https://www.taobao.com' },
                { name: '京东', icon: '📦', url: 'https://www.jd.com' },
                { name: '微博', icon: '📱', url: 'https://weibo.com' },
                { name: '知乎', icon: '💭', url: 'https://www.zhihu.com' },
                { name: '豆瓣', icon: '📖', url: 'https://www.douban.com' },
            ],
            video: [
                { name: '哔哩哔哩', icon: '📺', url: 'https://www.bilibili.com' },
                { name: '优酷', icon: '🎬', url: 'https://www.youku.com' },
                { name: '爱奇艺', icon: '🎥', url: 'https://www.iqiyi.com' },
                { name: '腾讯视频', icon: '📺', url: 'https://v.qq.com' },
                { name: '芒果TV', icon: '🍎', url: 'https://www.mgtv.com' },
                { name: '抖音', icon: '🎵', url: 'https://www.douyin.com' },
                { name: 'YouTube', icon: '▶️', url: 'https://www.youtube.com' },
                { name: 'Netflix', icon: '🎬', url: 'https://www.netflix.com' },
            ],
            social: [
                { name: '微信', icon: '💬', url: 'https://wx.qq.com' },
                { name: 'QQ', icon: '🐧', url: 'https://im.qq.com' },
                { name: '小红书', icon: '📕', url: 'https://www.xiaohongshu.com' },
                { name: 'Twitter', icon: '🐦', url: 'https://twitter.com' },
                { name: 'Instagram', icon: '📷', url: 'https://www.instagram.com' },
                { name: 'Facebook', icon: '👤', url: 'https://www.facebook.com' },
            ],
            tools: [
                { name: 'GitHub', icon: '💻', url: 'https://github.com' },
                { name: '百度网盘', icon: '💾', url: 'https://pan.baidu.com' },
                { name: '阿里云盘', icon: '☁️', url: 'https://www.aliyundrive.com' },
                { name: '腾讯文档', icon: '📝', url: 'https://docs.qq.com' },
                { name: '石墨文档', icon: '📄', url: 'https://shimo.im' },
                { name: 'ProcessOn', icon: '📊', url: 'https://www.processon.com' },
            ],
            ai: [
                { name: 'ChatGPT', icon: '🤖', url: 'https://chat.openai.com' },
                { name: 'Claude', icon: '🧠', url: 'https://claude.ai' },
                { name: 'DeepSeek', icon: '🔮', url: 'https://chat.deepseek.com' },
                { name: '通义千问', icon: '💬', url: 'https://tongyi.aliyun.com' },
                { name: '文心一言', icon: '🖋️', url: 'https://yiyan.baidu.com' },
                { name: 'Kimi', icon: '🌙', url: 'https://kimi.moonshot.cn' },
            ]
        };
        
        function setEngine(e) {
            engine = e;
            document.querySelectorAll('.engines span').forEach(s => s.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function search() {
            const q = document.getElementById('q').value;
            if (q) window.open(engines[engine] + encodeURIComponent(q));
            return false;
        }
        
        function renderSites(id, data) {
            document.getElementById(id).innerHTML = data.map(s => `
                <a href="${s.url}" target="_blank" class="card">
                    <span class="icon">${s.icon}</span>
                    <span class="name">${s.name}</span>
                </a>
            `).join('');
        }
        
        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerHTML = 
                now.toLocaleDateString('zh-CN', { weekday: 'long' }) + ' ' +
                now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }
        
        renderSites('common', sites.common);
        renderSites('video', sites.video);
        renderSites('social', sites.social);
        renderSites('tools', sites.tools);
        renderSites('ai', sites.ai);
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
