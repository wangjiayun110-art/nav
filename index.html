<html lang="zh-CN">

    <style>
        :root {
            --sidebar-width: 280px;
            --sidebar-bg: rgba(18, 18, 18, 0.95);
            --main-bg: #0f172a;
            --accent: #fbbf24;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        
        body {
            font-family: "Inter", "SF Pro Display", sans-serif;
            background-color: var(--main-bg);
            background-image: radial-gradient(at 0% 0%, rgba(251, 191, 36, 0.1) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* 侧边栏 */
        aside {
            width: var(--sidebar-width); height: 100vh;
            background: var(--sidebar-bg); backdrop-filter: blur(20px);
            position: fixed; left: 0; top: 0; z-index: 1000; padding: 50px 0;
            border-right: 1px solid var(--card-border); display: flex; flex-direction: column;
        }

        .logo-area { padding: 0 40px 60px; display: flex; align-items: center; gap: 15px; font-size: 1.5em; font-weight: 800; color: var(--accent); }
        .logo-gem { width: 14px; height: 14px; background: var(--accent); transform: rotate(45deg); box-shadow: 0 0 20px var(--accent); }

        .nav-list { list-style: none; flex: 1; }
        .nav-item a {
            display: flex; align-items: center; padding: 16px 40px;
            color: var(--text-secondary); text-decoration: none; transition: 0.4s;
            font-size: 1em; gap: 18px; font-weight: 500;
        }
        .nav-item a:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
        .nav-item a.active { color: var(--text-main); border-left: 5px solid var(--accent); padding-left: 35px; background: linear-gradient(90deg, rgba(251,191,36,0.1), transparent); }

        /* 主区域 */
        main { flex: 1; margin-left: var(--sidebar-width); padding: 60px 80px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; }

        .search-container {
            background: var(--card-bg); border-radius: 20px; padding: 16px 30px;
            width: 600px; display: flex; align-items: center; border: 1px solid var(--card-border);
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .search-container:focus-within { border-color: var(--accent); box-shadow: 0 0 40px rgba(251,191,36,0.15); width: 650px; }
        .search-container input { background: transparent; border: none; color: white; font-size: 1.1em; width: 100%; outline: none; }

        section { margin-bottom: 80px; scroll-margin-top: 60px; }
        .section-header { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
        .section-title { font-size: 1.5em; font-weight: 700; }
        .section-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--card-border), transparent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }

        .card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px;
            padding: 30px; display: flex; align-items: center; text-decoration: none; color: #fff;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(10px);
        }
        .card:hover { transform: translateY(-12px) scale(1.02); border-color: var(--accent); background: rgba(45, 55, 72, 0.8); box-shadow: 0 30px 60px rgba(0,0,0,0.4); }

        .card-icon { width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 2em; margin-right: 25px; transition: 0.5s; }
        .card:hover .card-icon { background: rgba(251,191,36,0.2); transform: rotate(10deg); }

        .card-name { font-weight: 700; font-size: 1.2em; margin-bottom: 8px; }
        .card-desc { font-size: 0.9em; color: var(--text-secondary); line-height: 1.6; }

        .card-special { border: 1px solid var(--accent); background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(30, 41, 59, 0.7)); }

        footer { margin-top: 100px; padding: 80px 0; text-align: center; border-top: 1px solid var(--card-border); color: var(--text-secondary); }
        .stats-box { margin-top: 25px; display: inline-flex; gap: 20px; background: rgba(255,255,255,0.03); padding: 10px 30px; border-radius: 50px; font-size: 0.85em; }
        
        .share-btn { margin-top: 30px; display: inline-flex; gap: 15px; }
        .btn-p { background: var(--accent); color: #000; padding: 10px 25px; border-radius: 50px; font-weight: 700; cursor: pointer; border: none; transition: 0.3s; }
        .btn-s { background: rgba(255,255,255,0.05); color: #fff; padding: 10px 25px; border-radius: 50px; cursor: pointer; border: 1px solid var(--card-border); transition: 0.3s; }
        .btn-p:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--accent); }

        @media (max-width: 1024px) { aside { width: 0; padding: 0; overflow: hidden; } main { margin-left: 0; padding: 40px 30px; } .search-container { width: 100%; } }
    </style>
</head>

    <script>

        }
        function updateTime() { document.getElementById('time').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }); }
        setInterval(updateTime, 1000); updateTime();
        const sections = document.querySelectorAll('section');
        const navItems = document.querySelectorAll('.nav-item a');
        window.addEventListener('scroll', () => {
            let curr = ""; sections.forEach(s => { if (pageYOffset >= s.offsetTop - 100) curr = s.getAttribute('id'); });
            navItems.forEach(a => { a.classList.remove('active'); if (a.getAttribute('href').substring(1) === curr) a.classList.add('active'); });
        });
